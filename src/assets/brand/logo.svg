<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none" role="img" aria-label="Jinzhai Tools" width="320" height="72">
  <defs>
    <linearGradient id="jzLogoGradient" x1="8" y1="6" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82FF" />
      <stop offset="0.5" stop-color="#06B6D4" />
      <stop offset="1" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="jzLogoStar" x1="45" y1="2" x2="61" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C8F26A" />
      <stop offset="1" stop-color="#7DE3B0" />
    </linearGradient>
    <linearGradient id="jzLogoText" x1="78" y1="20" x2="300" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B49D6" />
      <stop offset="1" stop-color="#0FA9C9" />
    </linearGradient>
  </defs>

  <!-- 图标 -->
  <g>
    <rect x="1" y="27" width="10" height="4.5" rx="2.25" fill="url(#jzLogoGradient)" opacity="0.55" />
    <rect x="0" y="35.5" width="7.5" height="4.5" rx="2.25" fill="url(#jzLogoGradient)" opacity="0.32" />
    <path d="M27 19.5v-4a4.5 4.5 0 0 1 9 0v4" stroke="url(#jzLogoGradient)" stroke-width="4" stroke-linecap="round" />
    <rect x="14" y="18.5" width="35" height="34" rx="9.5" fill="url(#jzLogoGradient)" />
    <g transform="translate(20.5 25.5)" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M7 10h3v-3l-3.5-3.5a6 6 0 0 1 8 8l6 6a2 2 0 0 1-3 3l-6-6a6 6 0 0 1-8-8l3.5 3.5" />
    </g>
    <path d="M52.5 3.5l2 5 5 2-5 2-2 5-2-5-5-2 5-2 2-5Z" fill="url(#jzLogoStar)" />
  </g>

  <!-- 文字 -->
  <text x="70" y="43" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5" fill="url(#jzLogoText)">Jinzhai Tools</text>

  <!-- 副标题 -->
  <text x="71" y="60" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="600" letter-spacing="2.6" fill="#7C8DA6">MAKE DEVELOPMENT SIMPLER</text>
</svg>
