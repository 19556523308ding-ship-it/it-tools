<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" fill="none" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Hero background">
  <defs>
    <radialGradient id="jzBlobBlue" cx="0" cy="0" r="1" gradientTransform="translate(300 110) scale(360 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F8BFF" stop-opacity="0.20" />
      <stop offset="1" stop-color="#4F8BFF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="jzBlobCyan" cx="0" cy="0" r="1" gradientTransform="translate(1180 400) scale(380 320)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06B6D4" stop-opacity="0.16" />
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="jzBlobTeal" cx="0" cy="0" r="1" gradientTransform="translate(820 40) scale(280 220)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14B8A6" stop-opacity="0.12" />
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="jzWaveLine" x1="0" y1="0" x2="1440" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563FF" stop-opacity="0.10" />
      <stop offset="0.5" stop-color="#06B6D4" stop-opacity="0.09" />
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0.06" />
    </linearGradient>
  </defs>

  <!-- 背景底色交给 CSS（.hero 的 grad-hero 变量），这里只画装饰，避免整块铺满 -->
  <rect width="1440" height="520" fill="url(#jzBlobBlue)" />
  <rect width="1440" height="520" fill="url(#jzBlobCyan)" />
  <rect width="1440" height="520" fill="url(#jzBlobTeal)" />

  <!-- 波浪线：细一些，只做质感不抢视觉 -->
  <path d="M-40 392C220 320 420 452 700 384C960 320 1180 428 1480 350" stroke="url(#jzWaveLine)" stroke-width="10" stroke-linecap="round" fill="none" />
  <path d="M-40 440C260 384 460 486 760 428C1020 376 1220 462 1480 404" stroke="url(#jzWaveLine)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.7" />
</svg>
