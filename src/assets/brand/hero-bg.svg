<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" fill="none" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Hero background">
  <defs>
    <linearGradient id="jzHeroBg" x1="0" y1="0" x2="1440" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF5FF" />
      <stop offset="0.55" stop-color="#F4FBFF" />
      <stop offset="1" stop-color="#FFFFFF" />
    </linearGradient>
    <radialGradient id="jzBlobBlue" cx="0" cy="0" r="1" gradientTransform="translate(300 120) scale(340 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F8BFF" stop-opacity="0.35" />
