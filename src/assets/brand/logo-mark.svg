<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Jinzhai Tools">
  <defs>
    <linearGradient id="jzMarkGradient" x1="8" y1="6" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82FF" />
      <stop offset="0.5" stop-color="#06B6D4" />
      <stop offset="1" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="jzMarkStar" x1="45" y1="2" x2="61" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C8F26A" />
      <stop offset="1" stop-color="#7DE3B0" />
    </linearGradient>
  </defs>

  <!-- 速度线 -->
  <rect x="2" y="30" width="9" height="4" rx="2" fill="url(#jzMarkGradient)" opacity="0.55" />
  <rect x="1" y="38" width="6.5" height="4" rx="2" fill="url(#jzMarkGradient)" opacity="0.32" />

  <!-- 工具箱提手 -->
  <path d="M25 20v-5.5a5.5 5.5 0 0 1 11 0V20" stroke="url(#jzMarkGradient)" stroke-width="5" stroke-linecap="round" />

  <!-- 工具箱主体 -->
  <rect x="4" y="18" width="56" height="44" rx="13" fill="url(#jzMarkGradient)" />

  <!-- 扳手 -->
  <g transform="translate(11 21)" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M7 10h3v-3l-3.5-3.5a6 6 0 0 1 8 8l6 6a2 2 0 0 1-3 3l-6-6a6 6 0 0 1-8-8l3.5 3.5" />
  </g>

  <!-- 星光 -->
  <path d="M50 3.5l2.3 6.2 6.2 2.3-6.2 2.3-2.3 6.2-2.3-6.2-6.2-2.3 6.2-2.3 2.3-6.2Z" fill="url(#jzMarkStar)" />
</svg>
