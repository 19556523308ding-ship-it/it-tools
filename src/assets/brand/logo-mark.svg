<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Jinzhai Tools">
  <defs>
    <linearGradient id="jzMarkGradient" x1="8" y1="6" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82FF" />
      <stop offset="0.5" stop-color="#06B6D4" />
      <stop offset="1" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="jzMarkStar" x1="45" y1="2" x2="61" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C8F26A" />
      <stop offset="1" stop-color="#7DE3B0" />
    </linearGradient>
  </defs>

  <!-- 速度线 -->
  <rect x="1" y="27" width="10" height="4.5" rx="2.25" fill="url(#jzMarkGradient)" opacity="0.55" />
  <rect x="0" y="35.5" width="7.5" height="4.5" rx="2.25" fill="url(#jzMarkGradient)" opacity="0.32" />

  <!-- 工具箱提手 -->
  <path d="M27 19.5v-4a4.5 4.5 0 0 1 9 0v4" stroke="url(#jzMarkGradient)" stroke-width="4" stroke-linecap="round" />

  <!-- 工具箱主体 -->
  <rect x="14" y="18.5" width="35" height="34" rx="9.5" fill="url(#jzMarkGradient)" />

  <!-- 扳手 -->
  <g transform="translate(20.5 25.5)" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M7 10h3v-3l-3.5-3.5a6 6 0 0 1 8 8l6 6a2 2 0 0 1-3 3l-6-6a6 6 0 0 1-8-8l3.5 3.5" />
  </g>

  <!-- 星光 -->
  <path d="M52.5 3.5l2 5 5 2-5 2-2 5-2-5-5-2 5-2 2-5Z" fill="url(#jzMarkStar)" />
</svg>
