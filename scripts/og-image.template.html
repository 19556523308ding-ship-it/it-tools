<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; }
  .wrap {
    position: relative;
    width: 1200px; height: 630px;
    background: linear-gradient(135deg, #eef5ff 0%, #f4fbff 55%, #ffffff 100%);
    font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif;
    display: flex; align-items: center;
    padding: 0 90px;
    gap: 70px;
  }
  .blob-a { position: absolute; width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(79,139,255,0.35), rgba(79,139,255,0) 70%);
    top: -220px; left: -160px; }
  .blob-b { position: absolute; width: 640px; height: 640px; border-radius: 50%;
    background: radial-gradient(circle, rgba(6,182,212,0.30), rgba(6,182,212,0) 70%);
    bottom: -240px; right: -140px; }
  .blob-c { position: absolute; width: 460px; height: 460px; border-radius: 50%;
    background: radial-gradient(circle, rgba(20,184,166,0.22), rgba(20,184,166,0) 70%);
    top: -120px; right: 240px; }
  .left { position: relative; z-index: 2; flex: 1; }
  .logo { display: flex; align-items: center; gap: 18px; margin-bottom: 34px; }
  .logo-text .name { font-size: 44px; font-weight: 800; letter-spacing: -0.5px;
    background: linear-gradient(90deg, #1b49d6, #0fa9c9);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .logo-text .tag { margin-top: 6px; font-size: 15px; font-weight: 700; letter-spacing: 3px; color: #7c8da6; }
  h1 { font-size: 60px; font-weight: 800; line-height: 1.18; letter-spacing: -1px; color: #0f172a; }
  .sub { margin-top: 22px; font-size: 24px; line-height: 1.6; color: #64748b; }
  .pills { margin-top: 34px; display: flex; gap: 12px; }
  .pill { padding: 10px 20px; border-radius: 999px; font-size: 17px; font-weight: 600; color: #2563ff;
    background: rgba(255,255,255,0.7); border: 1px solid rgba(37,99,255,0.35); }
  .pill.solid { color: #fff; background: linear-gradient(135deg,#2563ff,#06b6d4 55%,#14b8a6); border: none; }
  .right { position: relative; z-index: 2; width: 360px; height: 360px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; }
  .mark { width: 190px; height: 190px; }
  .spark { position: absolute; width: 16px; height: 16px; border-radius: 50%; }
  .s1 { top: 30px; left: 60px; background: #a3e635; }
  .s2 { bottom: 50px; right: 40px; background: #06b6d4; }
  .s3 { bottom: 20px; left: 90px; width: 11px; height: 11px; background: #2563ff; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="blob-a"></div><div class="blob-b"></div><div class="blob-c"></div>
    <div class="left">
      <div class="logo">
        <svg width="76" height="76" viewBox="0 0 64 64" fill="none">
          <defs><linearGradient id="g" x1="8" y1="6" x2="56" y2="60" gradientUnits="userSpaceOnUse">
            <stop stop-color="#3B82FF"/><stop offset="0.5" stop-color="#06B6D4"/><stop offset="1" stop-color="#14B8A6"/>
          </linearGradient><linearGradient id="s" x1="45" y1="2" x2="61" y2="20" gradientUnits="userSpaceOnUse">
            <stop stop-color="#C8F26A"/><stop offset="1" stop-color="#7DE3B0"/>
          </linearGradient></defs>
          <rect x="2" y="30" width="9" height="4" rx="2" fill="url(#g)" opacity="0.55"/>
          <rect x="1" y="38" width="6.5" height="4" rx="2" fill="url(#g)" opacity="0.32"/>
          <path d="M25 20v-5.5a5.5 5.5 0 0 1 11 0V20" stroke="url(#g)" stroke-width="5" stroke-linecap="round"/>
          <rect x="4" y="18" width="56" height="44" rx="13" fill="url(#g)"/>
          <g transform="translate(11 21)" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <path d="M7 10h3v-3l-3.5-3.5a6 6 0 0 1 8 8l6 6a2 2 0 0 1-3 3l-6-6a6 6 0 0 1-8-8l3.5 3.5"/>
          </g>
          <path d="M50 3.5l2.3 6.2 6.2 2.3-6.2 2.3-2.3 6.2-2.3-6.2-6.2-2.3 6.2-2.3 2.3-6.2Z" fill="url(#s)"/>
        </svg>
        <div class="logo-text">
          <div class="name">Jinzhai Tools</div>
          <div class="tag">MAKE DEVELOPMENT SIMPLER</div>
        </div>
      </div>
      <h1>实用的在线工具<br>助力开发者</h1>
      <div class="sub">免费 · 开源的开发者工具集合</div>
      <div class="pills">
        <div class="pill solid">86 个工具</div>
        <div class="pill">JSON</div>
        <div class="pill">Base64</div>
        <div class="pill">UUID</div>
        <div class="pill">Hash</div>
      </div>
    </div>
    <div class="right">
      <svg class="mark" viewBox="0 0 64 64" fill="none">
        <defs><linearGradient id="g2" x1="8" y1="6" x2="56" y2="60" gradientUnits="userSpaceOnUse">
          <stop stop-color="#3B82FF"/><stop offset="0.5" stop-color="#06B6D4"/><stop offset="1" stop-color="#14B8A6"/>
        </linearGradient><linearGradient id="s2" x1="45" y1="2" x2="61" y2="20" gradientUnits="userSpaceOnUse">
          <stop stop-color="#C8F26A"/><stop offset="1" stop-color="#7DE3B0"/>
        </linearGradient></defs>
        <rect x="2" y="30" width="9" height="4" rx="2" fill="url(#g2)" opacity="0.55"/>
        <rect x="1" y="38" width="6.5" height="4" rx="2" fill="url(#g2)" opacity="0.32"/>
        <path d="M25 20v-5.5a5.5 5.5 0 0 1 11 0V20" stroke="url(#g2)" stroke-width="5" stroke-linecap="round"/>
        <rect x="4" y="18" width="56" height="44" rx="13" fill="url(#g2)"/>
        <g transform="translate(11 21)" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M7 10h3v-3l-3.5-3.5a6 6 0 0 1 8 8l6 6a2 2 0 0 1-3 3l-6-6a6 6 0 0 1-8-8l3.5 3.5"/>
        </g>
        <path d="M50 3.5l2.3 6.2 6.2 2.3-6.2 2.3-2.3 6.2-2.3-6.2-6.2-2.3 6.2-2.3 2.3-6.2Z" fill="url(#s2)"/>
      </svg>
      <div class="spark s1"></div><div class="spark s2"></div><div class="spark s3"></div>
    </div>
  </div>
</body>
</html>
